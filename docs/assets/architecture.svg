<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Pensieve architecture</title>
  <desc id="desc">Host-agnostic architecture connecting host shells, dashboard core, memory providers, governance bridge, and memory stores.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9f6"/>
      <stop offset="1" stop-color="#e6eeeb"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#789991"/>
      <stop offset="1" stop-color="#7fa7aa"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6f8881" flood-opacity="0.12"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#78958e"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="32" fill="url(#bg2)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="70" y="70" font-size="14" letter-spacing="3" fill="#6e8982">HOST LAYER</text>
    <g filter="url(#s)">
      <rect x="70" y="95" width="240" height="82" rx="20" fill="#fff" fill-opacity="0.9" stroke="#bacbc6"/>
      <rect x="355" y="95" width="240" height="82" rx="20" fill="#fff" fill-opacity="0.9" stroke="#bacbc6"/>
      <rect x="640" y="95" width="240" height="82" rx="20" fill="#fff" fill-opacity="0.9" stroke="#bacbc6"/>
    </g>
    <text x="190" y="130" text-anchor="middle" font-size="18" font-weight="600" fill="#243c37">Codex</text>
    <text x="190" y="154" text-anchor="middle" font-size="13" fill="#72837f">Local plugin shell</text>
    <text x="475" y="130" text-anchor="middle" font-size="18" font-weight="600" fill="#243c37">Claude Code</text>
    <text x="475" y="154" text-anchor="middle" font-size="13" fill="#72837f">Future adapter</text>
    <text x="760" y="130" text-anchor="middle" font-size="18" font-weight="600" fill="#243c37">Other hosts</text>
    <text x="760" y="154" text-anchor="middle" font-size="13" fill="#72837f">Provider-compatible</text>

    <path d="M190 177V225H475" fill="none" stroke="#78958e" stroke-width="2"/>
    <path d="M475 177V225" fill="none" stroke="#78958e" stroke-width="2"/>
    <path d="M760 177V225H475" fill="none" stroke="#78958e" stroke-width="2"/>
    <path d="M475 225V250" stroke="#78958e" stroke-width="2" marker-end="url(#a)"/>

    <g filter="url(#s)">
      <rect x="345" y="260" width="260" height="108" rx="24" fill="url(#core)"/>
    </g>
    <text x="475" y="300" text-anchor="middle" font-size="14" letter-spacing="2" fill="#eef7f4">PENSIEVE CORE</text>
    <text x="475" y="333" text-anchor="middle" font-size="21" font-weight="600" fill="#fff">Dashboard projection</text>
    <text x="475" y="354" text-anchor="middle" font-size="13" fill="#e8f3f0">Snapshot · keywords · themes · actions</text>

    <path d="M605 314H690" stroke="#78958e" stroke-width="2" marker-end="url(#a)"/>
    <g filter="url(#s)">
      <rect x="705" y="260" width="250" height="108" rx="24" fill="#fff" fill-opacity="0.92" stroke="#abc2bc"/>
    </g>
    <text x="830" y="300" text-anchor="middle" font-size="14" letter-spacing="2" fill="#6e8982">PROVIDER BOUNDARY</text>
    <text x="830" y="333" text-anchor="middle" font-size="20" font-weight="600" fill="#243c37">MemoryProvider</text>
    <text x="830" y="354" text-anchor="middle" font-size="13" fill="#72837f">Read · govern · apply report</text>

    <path d="M955 314H1030" stroke="#78958e" stroke-width="2" marker-end="url(#a)"/>
    <g filter="url(#s)">
      <rect x="1040" y="260" width="115" height="108" rx="24" fill="#fff" fill-opacity="0.92" stroke="#abc2bc"/>
    </g>
    <text x="1097" y="306" text-anchor="middle" font-size="14" letter-spacing="1" fill="#6e8982">MEMORY</text>
    <text x="1097" y="335" text-anchor="middle" font-size="17" font-weight="600" fill="#243c37">Store</text>

    <path d="M830 368V425" stroke="#78958e" stroke-width="2" marker-end="url(#a)"/>
    <g filter="url(#s)">
      <rect x="620" y="438" width="420" height="105" rx="24" fill="#eef4f1" stroke="#abc2bc"/>
    </g>
    <text x="830" y="474" text-anchor="middle" font-size="14" letter-spacing="2" fill="#6e8982">GOVERNANCE BRIDGE</text>
    <text x="830" y="505" text-anchor="middle" font-size="19" font-weight="600" fill="#243c37">Report → Manifest → Receipt</text>
    <text x="830" y="528" text-anchor="middle" font-size="13" fill="#72837f">Auditable, reversible, host-executable state</text>

    <text x="70" y="520" font-size="14" letter-spacing="3" fill="#6e8982">DESIGN PRINCIPLE</text>
    <text x="70" y="550" font-size="17" fill="#344d47">Provider owns source-of-truth memory.</text>
    <text x="70" y="575" font-size="17" fill="#344d47">Pensieve owns observation and governance.</text>
  </g>
</svg>
